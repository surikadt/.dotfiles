set -ga terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"
set-option -g status-position top
set -s escape-time 0
set -g history-limit 30000

unbind C-b
bind -n Escape switch-client -T esc-prefix
bind -T esc-prefix f switch-client -T prefix
bind -T esc-prefix Escape send-keys Escape

bind r source-file ~/.tmux.conf
set -g base-index 1

# empty right status; flash PREFIX only while prefix armed
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse],}"

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key b run-shell "tmux-sessionizer ~/personal/builds"
bind-key -r ) run-shell -b '~/.local/bin/tmux-switch-session next'
bind-key -r ( run-shell -b '~/.local/bin/tmux-switch-session prev'
